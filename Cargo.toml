[package]
name = "xkit"
description = "Apple developer authentication, provisioning, signing, and installation."
authors = ["Kabir Oberai"]
edition = "2024"
version = "0.1.22"
license = "MIT"
repository = "https://github.com/jbisfun/xkit"

[dependencies]
tokio = {version = "1.43", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"]}
apple-codesign = { git = "https://github.com/jbisfun/apple-codesign", default-features = false }
apple-bundles = "0.21"
x509-certificate = "0.24"
rsa = "0.9"
rcgen = "0.12"
pem = "3.0"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
tempfile = "3"
idevice = {version = "=0.1.68", default-features = false, features = [
    "full",
    "ring",
]}
futures = {version = "0.3", default-features = false, features = ["std"]}
plist = "1.8"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
reqwest = {version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "gzip",
    "system-proxy",
]}
thiserror = "2.0"
uuid = {version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"]}
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = {version = "0.4", default-features = false, features = ["std", "serde"]}
zip = "8.6"
log = "0.4"

[dev-dependencies]
tokio = {version = "1.43", features = ["rt-multi-thread"]}

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
